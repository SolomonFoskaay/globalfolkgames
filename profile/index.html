<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile | GlobalFolkGames</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="mobile-container dash-rail-content dash-home">
        <section class="onboarding-billboard">
            <h2>My Profile</h2>
            <p class="auth-hint" id="profile-status" style="margin-top:8px;">Checking account...</p>
        </section>

        <div class="dash-grid">

        <section class="game-card">
            <h3>Welcome to your profile</h3>
            <p style="color:var(--muted); font-size:0.88rem; line-height:1.6; margin-top:8px;">Use the menu on the left to explore the details of your profile:</p>
            <ul style="color:var(--muted); font-size:0.88rem; line-height:2; margin-top:8px; padding-left:18px;">
                <li><a href="/profile/points.html" style="color:#f39c12;">Points and level</a> (local + global on-chain ledgers)</li>
                <li><a href="/profile/ledger.html" style="color:#f39c12;">On-chain ledger</a> (per-game rewards record)</li>
                <li><a href="/profile/activity.html" style="color:#f39c12;">On-chain activity</a> (every roll and reward, verifiable)</li>
            </ul>
        </section>

        <section class="game-card" style="text-align:center;">
            <button id="profile-signin-btn" class="auth-btn primary" hidden>Sign in</button>
        </section>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth.js"></script>
    <script src="/tamper-guard.js"></script>
    <script src="/profiles.js"></script>
    <script src="/header.js"></script>
    <script src="/dash-nav.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.initGlobalHeader) window.initGlobalHeader();

            window.GFG_DASH_NAV.render({
                brand: '👤 Profile',
                active: 'home',
                sections: [
                    { heading: 'Overview', items: [
                        { key: 'home', label: '🏠 Profile home', href: '/profile/' },
                    ]},
                    { heading: 'Detail', items: [
                        { key: 'points', label: '⭐ Points and level', href: '/profile/points.html' },
                        { key: 'ledger', label: '🏆 On-chain ledger', href: '/profile/ledger.html' },
                        { key: 'activity', label: '🔗 On-chain activity', href: '/profile/activity.html' },
                    ]},
                ]
            });

            const statusEl = document.getElementById('profile-status');
            const signinBtn = document.getElementById('profile-signin-btn');

            function render(signedIn) {
                if (!signedIn || !window.currentProfile) {
                    statusEl.textContent = 'Sign in to see your profile.';
                    signinBtn.hidden = false;
                    return;
                }
                const p = window.currentProfile;
                const name = p.display_name || p.username || 'Player';
                statusEl.textContent = 'Welcome, ' + name + '!';
                signinBtn.hidden = true;
            }

            signinBtn.addEventListener('click', () => { if (window.openDynamicLogin) window.openDynamicLogin(); });

            render(!!window.currentUser);
            if (window.refreshAuthHeader) {
                window.refreshAuthHeader().then(() => render(!!window.currentUser)).catch(() => render(false));
            }
        });
    </script>
</body>
</html>
