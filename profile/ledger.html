<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>On-chain ledger | Profile | GlobalFolkGames</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="mobile-container dash-rail-content">
        <section class="onboarding-billboard">
            <h2>🏆 On-chain points ledger</h2>
            <p class="auth-hint" id="ledger-status" style="margin-top:8px;">Checking account…</p>
        </section>

        <section class="game-card">
            <h3>Your ledger</h3>
            <p style="color:var(--muted); font-size:0.82rem; line-height:1.5;">Every reward you win is also written to a tamper-proof ledger on the Solana devnet (free for you to write). This is your own account, verified on-chain — not just a server record.</p>
            <div id="profile-ledger"><p class="empty">Check your ledger…</p></div>
        </section>

        <section class="game-card" style="text-align:center;">
            <button id="ledger-signin-btn" class="auth-btn primary" hidden>Sign in</button>
        </section>
    </main>

    <script src="/global_header.js"></script>
    <script src="/gfg-explorer.js"></script>
    <script src="/profile-core.js"></script>
        <script src="/pager.js"></script>
    <script src="/dash-nav.js"></script>
    <script src="/universal/ledgers/global-ledger.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.GFG_DASH_NAV.render({
                brand: '👤 Profile',
                active: 'ledger',
                sections: [
                    { heading: 'Overview', items: [
                        { key: 'home', label: '🏠 Profile home', href: '/profile/' },
                    ]},
                    { heading: 'Detail', items: [
                        { key: 'points', label: '⭐ Points & level', href: '/profile/points.html' },
                        { key: 'ledger', label: '🏆 On-chain ledger', href: '/profile/ledger.html' },
                        { key: 'activity', label: '🔗 On-chain activity', href: '/profile/activity.html' },
                    ]},
                ]
            });

            const statusEl = document.getElementById('ledger-status');
            const ledgerEl = document.getElementById('profile-ledger');
            const signinBtn = document.getElementById('ledger-signin-btn');

            function render(signedIn) {
                if (!signedIn) {
                    statusEl.textContent = 'Sign in to see your on-chain ledger.';
                    signinBtn.hidden = false;
                    return;
                }
                statusEl.textContent = 'Signed in — welcome back!';
                // Cache-only (single source of truth): the M3 module's board is
                // the only display source — never a direct RPC fetch here.
                const lp = window.localPoints;
                if (lp && typeof lp.get === 'function') {
                    const cur = lp.get('ludo');
                    if (cur && cur.spendableBalance != null) {
                        window.ProfileCore.loadPointsLedger(ledgerEl, 'ludo', cur);
                    } else if (typeof lp.checked === 'function' && lp.checked('ludo')) {
                        ledgerEl.innerHTML = '<p class="empty">No rewards yet. Win a match and your tally appears here.</p>';
                    } else {
                        ledgerEl.innerHTML = '<p class="empty">Checking your ledger…</p>';
                    }
                } else {
                    ledgerEl.innerHTML = '<p class="empty">Checking your ledger…</p>';
                }
                signinBtn.hidden = true;
            }

            // Auto-update the card when the M3 module pushes a refreshed ledger
            // (the first post-login check, wallet restore, a new match award).
            // Registered as soon as the module exists; a null-ledger notify just
            // re-renders the state through render(), and the cache re-pull
            // catches any notify that landed before we subscribed.
            function wireLedger() {
                if (!window.localPoints || typeof window.localPoints.subscribe !== 'function') {
                    if (wireLedger._tries++ < 10) setTimeout(wireLedger, 400);
                    return;
                }
                window.localPoints.subscribe(function (gameTag, ledger) {
                    if (window.currentProfile && gameTag === 'ludo') {
                        render(!!window.currentUser);
                    }
                });
                render(!!window.currentUser);
            }
            wireLedger._tries = 0;
            wireLedger();

            signinBtn.addEventListener('click', () => { if (window.openDynamicLogin) window.openDynamicLogin(); });

            render(!!window.currentUser);
            if (window.refreshAuthHeader) {
                window.refreshAuthHeader().then(() => render(!!window.currentUser)).catch(() => render(false));
            }
        });
    </script>
</body>
</html>
