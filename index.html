<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlobalFolkGames – Native Games On-Chain</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Shared Global Header (injected by header.js) -->
    <!-- Will appear here automatically -->

    <main class="mobile-container">

        <!-- HIGH CONVERTING BILLBOARD -->
        <section class="onboarding-billboard">
            <h2>Preserving Global Native Games On-Chain</h2>
            <p>Play traditional local games for free, accumulate lifetime milestone points, and unlock daily & weekly Web3 competitions with real reward pools.</p>
        </section>

        <!-- Level Tabs -->
        <nav class="level-tabs-scroll">
            <button class="tab-btn active" data-level="1">L1: Training</button>
            <button class="tab-btn" data-level="2">L2: Daily</button>
            <button class="tab-btn" data-level="3">L3: Weekly</button>
            <button class="tab-btn" data-level="4">L4: BiWeekly</button>
            <button class="tab-btn" data-level="5">L5: Monthly</button>
        </nav>

        <!-- Campaign Filters -->
        <div class="campaign-status-tabs">
            <button class="sub-tab-btn active" data-status="current">Active Now</button>
            <button class="sub-tab-btn" data-status="upcoming">Upcoming</button>
            <button class="sub-tab-btn" data-status="past">Past Results</button>
        </div>

        <!-- Campaign Cards -->
        <section id="campaign-display-box" class="content-viewport">
            <!-- filled by main.js -->
        </section>
    </main>

    <!-- Auth Modal (unchanged) -->
    <div id="auth-modal" class="auth-modal">
        <div class="auth-modal-content">
            <button id="auth-modal-close" class="auth-modal-close">×</button>
            <h2>Account</h2>
            <p class="auth-hint">Simple email + password. No wallet needed.</p>
            <input type="email" id="auth-email" placeholder="Email address" autocomplete="email">
            <input type="password" id="auth-password" placeholder="Password (min 6 chars)" autocomplete="current-password">
            <div class="auth-actions">
                <button id="btn-signin" class="auth-btn primary">Sign In</button>
                <button id="btn-signup" class="auth-btn secondary">Create Account</button>
            </div>
        </div>
    </div>

    <!-- Scripts – order is important -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="profiles.js"></script>
    <script src="header.js"></script>
    <script src="main.js"></script>

    <script>
        // Initialize shared header on landing page
        document.addEventListener('DOMContentLoaded', () => {
            window.initGlobalHeader();
        });
    </script>
</body>
</html>
