<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Native Ludo Matrix | GlobalFolkGames</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #121212; color: #fff;
            font-family: system-ui, sans-serif; display: flex; flex-direction: column;
            align-items: center; justify-content: center; min-height: 100vh;
            overflow: hidden;
        }
        header { width: 100%; display: flex; justify-content: space-between; padding: 10px 20px; box-sizing: border-box; background: #1e1e1e; position: absolute; top: 0; z-index: 10; }
        .back-btn { background: #333; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 0.9rem;}
        #canvas-wrapper { margin-top: 60px; display: flex; justify-content: center; align-items: center; width: 100vw; height: calc(100vh - 60px); position: relative; }
        canvas { background: #1a1a1a; max-width: 95vw; max-height: 95vw; aspect-ratio: 1/1; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border-radius: 8px; }
    </style>
</head>
<body>

    <header>
        <a href="../../index.html" class="back-btn">⬅ Leave Arena</a>
        <div style="font-weight: bold; color: #f39c12; margin-top: 5px;">🇳🇬 Native Ludo (Beta)</div>
    </header>

    <div id="canvas-wrapper">
        <canvas id="ludoCanvas" width="600" height="600"></canvas>
        
        <!-- Persistent Floating Control Center -->
        <div id="dice-container" style="position: absolute; bottom: 15px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: rgba(20,20,20,0.95); padding: 12px 20px; border-radius: 16px; border: 1px solid #333; box-shadow: 0 6px 20px rgba(0,0,0,0.7); min-width: 250px;">
            <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                <div id="turn-indicator" style="font-size: 1rem; font-weight: bold; color: #2ecc71;">Green's Turn</div>
                <button id="diceBtn" onclick="rollDiceEngine()" style="background: #f39c12; color: #000; border: none; width: 50px; height: 45px; border-radius: 8px; font-size: 1.6rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 6px rgba(0,0,0,0.4);">🎲</button>
            </div>
            
            <!-- Persistent Scoreboard HUD that stays completely static while players think -->
            <div id="persistent-scores" style="display: flex; gap: 10px; font-size: 0.9rem; font-weight: 600; color: #aaa; background: #151515; padding: 6px 12px; border-radius: 8px; width: 100%; justify-content: space-around; border: 1px solid #222;">
                <div>Die 1: <span id="val-d1" style="color: #fff;">-</span></div>
                <div>Die 2: <span id="val-d2" style="color: #fff;">-</span></div>
                <div style="color: #f39c12; font-weight: bold;"><span id="val-total">Total: -</span></div>
            </div>
        </div>
    </div>

    <!-- Script assets for game processing rendering -->
    <!-- Script assets for ultra-modular ludo processing micro-layers -->
    <script src="/games/ludo/board.js"></script>
    <script src="/games/ludo/physics.js"></script>
    
    <!-- State Layer -->
    <script src="/games/ludo/mechanics/state/turn.js"></script>
    
    <!-- Paths Layer -->
    <script src="/games/ludo/mechanics/paths/index.js"></script>
    
    <!-- Actions Layer -->
    <script src="/games/ludo/mechanics/actions/dice.js"></script>
    <script src="/games/ludo/mechanics/actions/movement.js"></script>
    <script src="/games/ludo/mechanics/actions/capture.js"></script>
    
    <script>console.log('Ultra-modular ludo core running successfully.');</script>
</body>
</html>
