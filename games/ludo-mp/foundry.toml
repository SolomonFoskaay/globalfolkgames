# games/ludo-mp/foundry.toml
# Standalone Foundry project for the ludo-mp module (Foskaay GGI multiplayer on
# Arc testnet). It is SEPARATE from evm/ (the GFG Arc rail, arcv2m16) and from
# the standalone Foskaay GGI repo. The deployed proxy addresses are PERMANENT,
# so future changes are upgrades, never new addresses.
#
# Local-only: compile + test with no chain, no cost, no secrets.
#   forge build
#   forge test
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# via_ir resolves "stack too deep" on the settle helpers with many parameters.
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/vendored-openzeppelin/contracts/",
]

# Arc endpoints (public, no secret). Mainnet only when we get there.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"
