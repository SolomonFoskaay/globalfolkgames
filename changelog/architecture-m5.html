<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M5 · Subscription | Architecture | GlobalFolkGames</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/changelog/changelog.css">
</head>
<body data-module="m5">

    <main class="mobile-container dash-rail-content changelog-page admin">
        <div id="architecture-items" class="changelog-entries">
            <p class="empty">Checking access…</p>
        </div>
    </main>

    <!-- Global scripts (needed for points + auth → wallet role) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/auth.js"></script>
    <script src="/tamper-guard.js"></script>
    <script src="/profiles.js"></script>
    <script src="/tiers.js"></script>
    <script src="/header.js"></script>
    <script src="/changelog/render.js"></script>
    <script src="/dash-nav.js"></script>
    <script src="/changelog/architecture.js"></script>
    <script type="module" src="/src/main.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.initGlobalHeader) window.initGlobalHeader();

            if (window.requireStaffAccess) {
                const role = await window.requireStaffAccess();
                if (role && window.renderArchitecture) window.renderArchitecture();
            } else if (window.renderArchitecture) {
                window.renderArchitecture();
            }

            if (window.GFG_DASH_NAV) {
                window.GFG_DASH_NAV.render({
                    brand: '🏛 Architecture',
                    active: 'm5',
                    sections: [
                        { heading: 'Workspace', items: [
                            { key: 'home', label: '🏛 Overview', href: '/changelog/architecture.html' },
                        ]},
                        { heading: 'Modules', items: [{"key": "home", "label": "Overview", "href": "/changelog/architecture.html"}, {"key": "m1", "label": "M1 \u00b7 Game core", "href": "/changelog/architecture-m1.html"}, {"key": "m2", "label": "M2 \u00b7 Result seam", "href": "/changelog/architecture-m2.html"}, {"key": "m3", "label": "M3 \u00b7 Local points", "href": "/changelog/architecture-m3.html"}, {"key": "m4", "label": "M4 \u00b7 Global ledgers", "href": "/changelog/architecture-m4.html"}, {"key": "m5", "label": "M5 \u00b7 Subscription", "href": "/changelog/architecture-m5.html"}, {"key": "m6", "label": "M6 \u00b7 Point sources", "href": "/changelog/architecture-m6.html"}, {"key": "m7", "label": "M7 \u00b7 Competitions", "href": "/changelog/architecture-m7.html"}, {"key": "m8", "label": "M8 \u00b7 Sponsor escrow", "href": "/changelog/architecture-m8.html"}] },
                    ]
                });
            }
        });
    </script>
</body>
</html>
