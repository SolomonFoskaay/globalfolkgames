<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Economics (Admin) | GlobalFolkGames</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/changelog/changelog.css">
</head>
<body>

    <main class="changelog-page admin">
        <section class="changelog-head">
            <a href="/changelog/admin.html" class="changelog-back">← Changelog admin</a>
            <h2>Game Economics, staff workspace</h2>
            <p class="changelog-sub">Break-or-make economics design. Raw thoughts are captured here first, shaped into fine-tuned designs, and only when finalized move to "ready" for promotion into the normal changelog roadmap. Staff only.</p>
            <div class="changelog-meta">
                <span id="changelog-role" class="changelog-role"></span>
                <a href="/changelog/" class="changelog-admin-link">Public view →</a>
            </div>
        </section>

        <div id="economics-items" class="changelog-entries">
            <p class="empty">Checking access…</p>
        </div>
    </main>

    <!-- Global scripts (needed for points + auth → wallet role) -->
    <script src="/global_header.js"></script>
    <script src="/changelog/render.js"></script>
    <script src="/changelog/economics.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.requireStaffAccess) {
                const role = await window.requireStaffAccess();
                if (role && window.renderEconomics) window.renderEconomics();
            } else if (window.renderEconomics) {
                window.renderEconomics();
            }
        });
    </script>
</body>
</html>
